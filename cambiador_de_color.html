<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="./cambiador_de_color.js"></script>
</head>
<body>
    <div class="card" id="tarjeta" style="padding: 20px; margin-top: 10px; border: 1px solid #ccc;">
        <h1 >Dios es amor</h1>
        <p >Sin Dios no somos nada, nos faltaria el aire, el viento.<p>
        <select name="select" id="select_color"> 
            <option value="predeterminado" datacolor="#ffffff" selected>Blanco (por defecto)</option>
            <option value="erro" datacolor="#ffcccc">Rojo suave</option>
            <option value="bien" datacolor="#ccffcc">Verde suave</option>
            <option value="agua" datacolor="#cce5ff">Azul suave</option>
            <option value="advertencia" datacolor="#F5F227">amarillo</option>
            <option value="megustastefa" datacolor="#D100FF">rosa</option>
        </select>
    </div>
</body>
</html>
